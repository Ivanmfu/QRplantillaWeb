<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NUCLEAR CACHE PREVENTION v5.1.0 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <title>Plantilla Auto QR Web v5.1.0</title>
    <!-- Cache cleanup PRIMERO - antes de cualquier otro script -->
    <script>
      // Inline version check - executed BEFORE cleanup.js
      const inlineVersion = '5.1.0';
      const storedVersion = localStorage.getItem('app_version');
      if (storedVersion && storedVersion !== inlineVersion) {
        console.log('%c🔄 FORCE RELOAD: Version mismatch ' + storedVersion + ' → ' + inlineVersion, 'color: red; font-weight: bold;');
        localStorage.setItem('app_version', inlineVersion);
        location.reload(true);
      }
    </script>
    <script src="/cleanup.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
